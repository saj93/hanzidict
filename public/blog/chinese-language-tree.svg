<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330">
<style>
  .bg          { fill: transparent; }
  .root-rect   { fill: #f5f5f3; stroke: #bbb; stroke-width: 1.2; }
  .sinitic-rect{ fill: #e8f5ef; stroke: #1D9E75; stroke-width: 1.8; }
  .tb-rect     { fill: #f0f0ee; stroke: #aaa; stroke-width: 1.2; }

  .mand-rect   { fill: #e8f5ef; stroke: #1D9E75; stroke-width: 1.4; }
  .wu-rect     { fill: #fdf0e5; stroke: #e8954a; stroke-width: 1.4; }
  .cant-rect   { fill: #e8f5ef; stroke: #1D9E75; stroke-width: 1.4; }
  .min-rect    { fill: #f2eaf7; stroke: #a87ec0; stroke-width: 1.4; }
  .hakka-rect  { fill: #fdf8e5; stroke: #d4b84a; stroke-width: 1.4; }
  .gan-rect    { fill: #e8f0f7; stroke: #7ab2d8; stroke-width: 1.4; }
  .xiang-rect  { fill: #e8f0f7; stroke: #7ab2d8; stroke-width: 1.4; }

  .t-base      { fill: #1a1916; }
  .t-dim       { fill: #666; }
  .t-dimmer    { fill: #999; }
  .t-footnote  { fill: #bbb; }
  .t-tb        { fill: #555; }
  .t-tb-sub    { fill: #999; }
  .t-green     { fill: #1D9E75; }
  .t-green-sub { fill: #0d7a50; }
  .t-orange    { fill: #c46a10; }
  .t-purple    { fill: #8050a8; }
  .t-yellow    { fill: #907218; }
  .t-blue      { fill: #4882b0; }

  .c-green  { stroke: #1D9E75; }
  .c-gray   { stroke: #bbb; }

  @media (prefers-color-scheme: dark) {
    .bg          { fill: #1a1916; }
    .root-rect   { fill: #2a2926; stroke: #444; }
    .sinitic-rect{ fill: #142d20; stroke: #1D9E75; }
    .tb-rect     { fill: #222220; stroke: #555; }

    .mand-rect   { fill: #142d20; stroke: #1D9E75; }
    .wu-rect     { fill: #2c1e10; stroke: #e8954a; }
    .cant-rect   { fill: #142d20; stroke: #1D9E75; }
    .min-rect    { fill: #231630; stroke: #a87ec0; }
    .hakka-rect  { fill: #2a2410; stroke: #d4b84a; }
    .gan-rect    { fill: #1e2630; stroke: #7ab2d8; }
    .xiang-rect  { fill: #1e2630; stroke: #7ab2d8; }

    .t-base      { fill: #fff; }
    .t-dim       { fill: #bbb; }
    .t-dimmer    { fill: #777; }
    .t-footnote  { fill: #444; }
    .t-tb        { fill: #bbb; }
    .t-tb-sub    { fill: #777; }
    .t-green     { fill: #1D9E75; }
    .t-green-sub { fill: #4fc89a; }
    .t-orange    { fill: #e8954a; }
    .t-purple    { fill: #a87ec0; }
    .t-yellow    { fill: #d4b84a; }
    .t-blue      { fill: #7ab2d8; }

    .c-green  { stroke: #1D9E75; }
    .c-gray   { stroke: #666; }
  }
</style>

  <!-- Background -->
  <rect class="bg" width="900" height="330"/>

  <!-- Root -->
  <rect class="root-rect" x="440" y="18" width="200" height="48" rx="7"/>
  <text x="540" y="38" class="t-base" font-size="13" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Proto-Sino-Tibetan</text>
  <text x="540" y="56" class="t-dim" font-size="10.5" font-family="system-ui,sans-serif" text-anchor="middle">common ancestor</text>

  <!-- Branch lines from root -->
  <line class="c-green" x1="510" y1="66" x2="350" y2="106" stroke-width="1.6"/>
  <line class="c-gray"  x1="570" y1="66" x2="760" y2="106" stroke-width="1.6"/>

  <!-- Sinitic -->
  <rect class="sinitic-rect" x="218" y="106" width="264" height="50" rx="7"/>
  <text x="350" y="127" class="t-green" font-size="13" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Sinitic (Chinese)</text>
  <text x="350" y="145" class="t-green-sub" font-size="10.5" font-family="system-ui,sans-serif" text-anchor="middle">~1.3 billion speakers</text>

  <!-- Tibeto-Burman -->
  <rect class="tb-rect" x="658" y="106" width="224" height="50" rx="7"/>
  <text x="770" y="127" class="t-tb" font-size="13" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Tibeto-Burman</text>
  <text x="770" y="145" class="t-tb-sub" font-size="10.5" font-family="system-ui,sans-serif" text-anchor="middle">Tibetan, Burmese, others</text>

  <!-- Dashed bus down from Sinitic -->
  <line class="c-green" x1="350" y1="156" x2="350" y2="188" stroke-width="1.4" stroke-dasharray="5,4"/>
  <!-- Horizontal bus -->
  <line class="c-green" x1="50"  y1="188" x2="700" y2="188" stroke-width="1.4" stroke-dasharray="5,4"/>
  <!-- Verticals to leaves -->
  <line class="c-green" x1="50"  y1="188" x2="50"  y2="208" stroke-width="1.2"/>
  <line class="c-green" x1="150" y1="188" x2="150" y2="208" stroke-width="1.2"/>
  <line class="c-green" x1="250" y1="188" x2="250" y2="208" stroke-width="1.2"/>
  <line class="c-green" x1="350" y1="188" x2="350" y2="208" stroke-width="1.2"/>
  <line class="c-green" x1="450" y1="188" x2="450" y2="208" stroke-width="1.2"/>
  <line class="c-green" x1="575" y1="188" x2="575" y2="208" stroke-width="1.2"/>
  <line class="c-green" x1="700" y1="188" x2="700" y2="208" stroke-width="1.2"/>

  <!-- Mandarin -->
  <rect class="mand-rect" x="5"   y="208" width="90" height="72" rx="6"/>
  <text x="50"  y="228" class="t-base"     font-size="11" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Mandarin</text>
  <text x="50"  y="243" class="t-green"    font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">普通话</text>
  <text x="50"  y="258" class="t-dimmer"   font-size="9.5" font-family="system-ui,sans-serif" text-anchor="middle">~920M</text>
  <text x="50"  y="272" class="t-dimmer"   font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">N/SW China</text>

  <!-- Wu -->
  <rect class="wu-rect" x="105" y="208" width="90" height="72" rx="6"/>
  <text x="150" y="228" class="t-base"    font-size="11" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Wu</text>
  <text x="150" y="243" class="t-orange"  font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">吴语</text>
  <text x="150" y="258" class="t-dimmer"  font-size="9.5" font-family="system-ui,sans-serif" text-anchor="middle">Shanghai</text>
  <text x="150" y="272" class="t-dimmer"  font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">Zhejiang</text>

  <!-- Cantonese -->
  <rect class="cant-rect" x="205" y="208" width="90" height="72" rx="6"/>
  <text x="250" y="228" class="t-base"    font-size="11" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Cantonese</text>
  <text x="250" y="243" class="t-green"   font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">粤语</text>
  <text x="250" y="258" class="t-dimmer"  font-size="9.5" font-family="system-ui,sans-serif" text-anchor="middle">Guangdong</text>
  <text x="250" y="272" class="t-dimmer"  font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">Hong Kong</text>

  <!-- Min -->
  <rect class="min-rect" x="305" y="208" width="90" height="72" rx="6"/>
  <text x="350" y="228" class="t-base"   font-size="11" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Min</text>
  <text x="350" y="243" class="t-purple" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">闽语</text>
  <text x="350" y="258" class="t-dimmer" font-size="9.5" font-family="system-ui,sans-serif" text-anchor="middle">Fujian</text>
  <text x="350" y="272" class="t-dimmer" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">Taiwan, SE Asia</text>

  <!-- Hakka -->
  <rect class="hakka-rect" x="405" y="208" width="90" height="72" rx="6"/>
  <text x="450" y="228" class="t-base"   font-size="11" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Hakka</text>
  <text x="450" y="243" class="t-yellow" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">客家话</text>
  <text x="450" y="258" class="t-dimmer" font-size="9.5" font-family="system-ui,sans-serif" text-anchor="middle">scattered</text>
  <text x="450" y="272" class="t-dimmer" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">Guangdong, Fujian</text>

  <!-- Gan -->
  <rect class="gan-rect" x="530" y="208" width="90" height="72" rx="6"/>
  <text x="575" y="228" class="t-base"   font-size="11" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Gan</text>
  <text x="575" y="243" class="t-blue"   font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">赣语</text>
  <text x="575" y="258" class="t-dimmer" font-size="9.5" font-family="system-ui,sans-serif" text-anchor="middle">Jiangxi</text>
  <text x="575" y="272" class="t-dimmer" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">~50M speakers</text>

  <!-- Xiang -->
  <rect class="xiang-rect" x="655" y="208" width="90" height="72" rx="6"/>
  <text x="700" y="228" class="t-base"   font-size="11" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Xiang</text>
  <text x="700" y="243" class="t-blue"   font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">湘语</text>
  <text x="700" y="258" class="t-dimmer" font-size="9.5" font-family="system-ui,sans-serif" text-anchor="middle">Hunan</text>
  <text x="700" y="272" class="t-dimmer" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">~38M speakers</text>

  <!-- Footnote -->
  <text x="450" y="314" class="t-footnote" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Branches share a writing system but are largely mutually unintelligible in speech</text>
</svg>
