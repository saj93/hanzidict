<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320">
  <rect width="680" height="320" fill="#1a1916"/>

  <!-- ===== ROOT ===== -->
  <rect x="260" y="20" width="160" height="38" rx="6" fill="#2a2926" stroke="#444" stroke-width="1"/>
  <text x="340" y="35" fill="#fff" font-size="12" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">Proto-Sino-Tibetan</text>
  <text x="340" y="51" fill="#888" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">common ancestor</text>

  <!-- Root → Sinitic branch line -->
  <line x1="310" y1="58" x2="200" y2="108" stroke="#1D9E75" stroke-width="1.5"/>
  <!-- Root → Tibeto-Burman branch line -->
  <line x1="370" y1="58" x2="490" y2="108" stroke="#888" stroke-width="1.5"/>

  <!-- ===== SINITIC BRANCH ===== -->
  <rect x="110" y="108" width="178" height="38" rx="6" fill="#1a3d2e" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="199" y="123" fill="#1D9E75" font-size="12" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">Sinitic (Chinese)</text>
  <text x="199" y="139" fill="#4fc89a" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">~1.3 billion speakers</text>

  <!-- ===== TIBETO-BURMAN BRANCH ===== -->
  <rect x="404" y="108" width="178" height="38" rx="6" fill="#2a2926" stroke="#555" stroke-width="1"/>
  <text x="493" y="123" fill="#aaa" font-size="12" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">Tibeto-Burman</text>
  <text x="493" y="139" fill="#666" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Tibetan, Burmese, others</text>

  <!-- ===== SINITIC LEAVES ===== -->
  <!-- connector from Sinitic down -->
  <line x1="199" y1="146" x2="199" y2="175" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- horizontal bar -->
  <line x1="32" y1="175" x2="366" y2="175" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- verticals to leaves -->
  <line x1="32"  y1="175" x2="32"  y2="198" stroke="#1D9E75" stroke-width="1.2"/>
  <line x1="88"  y1="175" x2="88"  y2="198" stroke="#1D9E75" stroke-width="1.2"/>
  <line x1="154" y1="175" x2="154" y2="198" stroke="#1D9E75" stroke-width="1.2"/>
  <line x1="224" y1="175" x2="224" y2="198" stroke="#1D9E75" stroke-width="1.2"/>
  <line x1="293" y1="175" x2="293" y2="198" stroke="#1D9E75" stroke-width="1.2"/>
  <line x1="340" y1="175" x2="340" y2="198" stroke="#1D9E75" stroke-width="1.2"/>
  <line x1="366" y1="175" x2="366" y2="198" stroke="#1D9E75" stroke-width="1.2"/>

  <!-- Mandarin -->
  <rect x="2"   y="198" width="60" height="48" rx="5" fill="#1a3d2e" stroke="#1D9E75" stroke-width="1.2"/>
  <text x="32"  y="218" fill="#fff" font-size="10.5" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">Mandarin</text>
  <text x="32"  y="231" fill="#4fc89a" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">普通话</text>
  <text x="32"  y="243" fill="#888" font-size="8.5" font-family="system-ui,sans-serif" text-anchor="middle">~920M</text>

  <!-- Wu -->
  <rect x="58"  y="198" width="60" height="48" rx="5" fill="#2c1e10" stroke="#d4842a" stroke-width="1.2"/>
  <text x="88"  y="218" fill="#fff" font-size="10.5" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">Wu</text>
  <text x="88"  y="231" fill="#d4842a" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">吴语</text>
  <text x="88"  y="243" fill="#888" font-size="8.5" font-family="system-ui,sans-serif" text-anchor="middle">Shanghai</text>

  <!-- Cantonese -->
  <rect x="124" y="198" width="60" height="48" rx="5" fill="#1a3d2e" stroke="#1D9E75" stroke-width="1.2"/>
  <text x="154" y="216" fill="#fff" font-size="10.5" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">Cantonese</text>
  <text x="154" y="228" fill="#4fc89a" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">粤语</text>
  <text x="154" y="240" fill="#888" font-size="8.5" font-family="system-ui,sans-serif" text-anchor="middle">HK, Guangdong</text>

  <!-- Min -->
  <rect x="193" y="198" width="62" height="48" rx="5" fill="#231630" stroke="#8a52a0" stroke-width="1.2"/>
  <text x="224" y="218" fill="#fff" font-size="10.5" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">Min</text>
  <text x="224" y="231" fill="#a87ec0" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">闽语</text>
  <text x="224" y="243" fill="#888" font-size="8.5" font-family="system-ui,sans-serif" text-anchor="middle">Fujian, Taiwan</text>

  <!-- Hakka -->
  <rect x="261" y="198" width="62" height="48" rx="5" fill="#2a2410" stroke="#c9a820" stroke-width="1.2"/>
  <text x="293" y="218" fill="#fff" font-size="10.5" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">Hakka</text>
  <text x="293" y="231" fill="#c9a820" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">客家话</text>
  <text x="293" y="243" fill="#888" font-size="8.5" font-family="system-ui,sans-serif" text-anchor="middle">scattered</text>

  <!-- Gan -->
  <rect x="311" y="198" width="58" height="48" rx="5" fill="#1e2630" stroke="#5b7fa6" stroke-width="1.2"/>
  <text x="340" y="218" fill="#fff" font-size="10.5" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">Gan</text>
  <text x="340" y="231" fill="#7da8d0" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">赣语</text>
  <text x="340" y="243" fill="#888" font-size="8.5" font-family="system-ui,sans-serif" text-anchor="middle">Jiangxi</text>

  <!-- Xiang -->
  <rect x="338" y="198" width="56" height="48" rx="5" fill="#1e2630" stroke="#5b7fa6" stroke-width="1.2"/>
  <text x="366" y="218" fill="#fff" font-size="10.5" font-weight="600" font-family="system-ui,sans-serif" text-anchor="middle">Xiang</text>
  <text x="366" y="231" fill="#7da8d0" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">湘语</text>
  <text x="366" y="243" fill="#888" font-size="8.5" font-family="system-ui,sans-serif" text-anchor="middle">Hunan</text>

  <!-- ===== NOTE ===== -->
  <text x="340" y="295" fill="#555" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Branches share a writing system but are largely mutually unintelligible in speech</text>
</svg>
