<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330">
  <rect width="900" height="330" fill="#1a1916"/>

  <!-- ===== ROOT ===== -->
  <rect x="440" y="18" width="200" height="48" rx="7" fill="#2a2926" stroke="#444" stroke-width="1.2"/>
  <text x="540" y="38" fill="#fff" font-size="13" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Proto-Sino-Tibetan</text>
  <text x="540" y="56" fill="#888" font-size="10.5" font-family="system-ui,sans-serif" text-anchor="middle">common ancestor</text>

  <!-- ===== BRANCH LINES from root ===== -->
  <line x1="510" y1="66" x2="350" y2="106" stroke="#1D9E75" stroke-width="1.6"/>
  <line x1="570" y1="66" x2="760" y2="106" stroke="#666" stroke-width="1.6"/>

  <!-- ===== SINITIC BRANCH ===== -->
  <rect x="218" y="106" width="264" height="50" rx="7" fill="#142d20" stroke="#1D9E75" stroke-width="1.8"/>
  <text x="350" y="127" fill="#1D9E75" font-size="13" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Sinitic (Chinese)</text>
  <text x="350" y="145" fill="#4fc89a" font-size="10.5" font-family="system-ui,sans-serif" text-anchor="middle">~1.3 billion speakers</text>

  <!-- ===== TIBETO-BURMAN BRANCH ===== -->
  <rect x="658" y="106" width="224" height="50" rx="7" fill="#222220" stroke="#555" stroke-width="1.2"/>
  <text x="770" y="127" fill="#bbb" font-size="13" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Tibeto-Burman</text>
  <text x="770" y="145" fill="#777" font-size="10.5" font-family="system-ui,sans-serif" text-anchor="middle">Tibetan, Burmese, others</text>

  <!-- ===== FAN from Sinitic to leaves ===== -->
  <!-- vertical stem down from Sinitic -->
  <line x1="350" y1="156" x2="350" y2="188" stroke="#1D9E75" stroke-width="1.4" stroke-dasharray="5,4"/>
  <!-- horizontal bus -->
  <line x1="50" y1="188" x2="700" y2="188" stroke="#1D9E75" stroke-width="1.4" stroke-dasharray="5,4"/>
  <!-- verticals to each leaf -->
  <line x1="50"  y1="188" x2="50"  y2="208" stroke="#1D9E75" stroke-width="1.2"/>
  <line x1="150" y1="188" x2="150" y2="208" stroke="#1D9E75" stroke-width="1.2"/>
  <line x1="250" y1="188" x2="250" y2="208" stroke="#1D9E75" stroke-width="1.2"/>
  <line x1="350" y1="188" x2="350" y2="208" stroke="#1D9E75" stroke-width="1.2"/>
  <line x1="450" y1="188" x2="450" y2="208" stroke="#1D9E75" stroke-width="1.2"/>
  <line x1="575" y1="188" x2="575" y2="208" stroke="#1D9E75" stroke-width="1.2"/>
  <line x1="700" y1="188" x2="700" y2="208" stroke="#1D9E75" stroke-width="1.2"/>

  <!-- ===== LEAF NODES ===== -->
  <!-- node centers at x: 50, 150, 250, 350, 450, 575, 700 — each 90px wide -->

  <!-- Mandarin -->
  <rect x="5"   y="208" width="90" height="72" rx="6" fill="#142d20" stroke="#1D9E75" stroke-width="1.4"/>
  <text x="50"  y="228" fill="#fff" font-size="11" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Mandarin</text>
  <text x="50"  y="243" fill="#4fc89a" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">普通话</text>
  <text x="50"  y="258" fill="#777" font-size="9.5" font-family="system-ui,sans-serif" text-anchor="middle">~920M</text>
  <text x="50"  y="272" fill="#666" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">N/SW China</text>

  <!-- Wu -->
  <rect x="105" y="208" width="90" height="72" rx="6" fill="#2c1e10" stroke="#e8954a" stroke-width="1.4"/>
  <text x="150" y="228" fill="#fff" font-size="11" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Wu</text>
  <text x="150" y="243" fill="#e8954a" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">吴语</text>
  <text x="150" y="258" fill="#777" font-size="9.5" font-family="system-ui,sans-serif" text-anchor="middle">Shanghai</text>
  <text x="150" y="272" fill="#666" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">Zhejiang</text>

  <!-- Cantonese -->
  <rect x="205" y="208" width="90" height="72" rx="6" fill="#142d20" stroke="#1D9E75" stroke-width="1.4"/>
  <text x="250" y="228" fill="#fff" font-size="11" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Cantonese</text>
  <text x="250" y="243" fill="#4fc89a" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">粤语</text>
  <text x="250" y="258" fill="#777" font-size="9.5" font-family="system-ui,sans-serif" text-anchor="middle">Guangdong</text>
  <text x="250" y="272" fill="#666" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">Hong Kong</text>

  <!-- Min -->
  <rect x="305" y="208" width="90" height="72" rx="6" fill="#231630" stroke="#a87ec0" stroke-width="1.4"/>
  <text x="350" y="228" fill="#fff" font-size="11" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Min</text>
  <text x="350" y="243" fill="#a87ec0" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">闽语</text>
  <text x="350" y="258" fill="#777" font-size="9.5" font-family="system-ui,sans-serif" text-anchor="middle">Fujian</text>
  <text x="350" y="272" fill="#666" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">Taiwan, SE Asia</text>

  <!-- Hakka -->
  <rect x="405" y="208" width="90" height="72" rx="6" fill="#2a2410" stroke="#d4b84a" stroke-width="1.4"/>
  <text x="450" y="228" fill="#fff" font-size="11" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Hakka</text>
  <text x="450" y="243" fill="#d4b84a" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">客家话</text>
  <text x="450" y="258" fill="#777" font-size="9.5" font-family="system-ui,sans-serif" text-anchor="middle">scattered</text>
  <text x="450" y="272" fill="#666" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">Guangdong, Fujian</text>

  <!-- Gan -->
  <rect x="530" y="208" width="90" height="72" rx="6" fill="#1e2630" stroke="#7ab2d8" stroke-width="1.4"/>
  <text x="575" y="228" fill="#fff" font-size="11" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Gan</text>
  <text x="575" y="243" fill="#7ab2d8" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">赣语</text>
  <text x="575" y="258" fill="#777" font-size="9.5" font-family="system-ui,sans-serif" text-anchor="middle">Jiangxi</text>
  <text x="575" y="272" fill="#666" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">~50M speakers</text>

  <!-- Xiang -->
  <rect x="655" y="208" width="90" height="72" rx="6" fill="#1e2630" stroke="#7ab2d8" stroke-width="1.4"/>
  <text x="700" y="228" fill="#fff" font-size="11" font-weight="700" font-family="system-ui,sans-serif" text-anchor="middle">Xiang</text>
  <text x="700" y="243" fill="#7ab2d8" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">湘语</text>
  <text x="700" y="258" fill="#777" font-size="9.5" font-family="system-ui,sans-serif" text-anchor="middle">Hunan</text>
  <text x="700" y="272" fill="#666" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">~38M speakers</text>

  <!-- ===== FOOTNOTE ===== -->
  <text x="450" y="314" fill="#444" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Branches share a writing system but are largely mutually unintelligible in speech</text>
</svg>
