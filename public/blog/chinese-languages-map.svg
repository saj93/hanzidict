<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450">
  <rect width="680" height="450" fill="#1a1916"/>

  <!-- China outer border (realistic simplified outline, clockwise from NW) -->
  <!-- Scale: x=(lon-73)*9.68+40, y=(53-lat)*11.71+20 -->
  <path d="
    M 50,172
    L 185,67
    Q 225,73 272,79
    Q 325,95 379,114
    L 456,149
    L 514,79
    L 573,32
    L 630,79
    L 601,137
    L 573,172
    L 504,172
    Q 504,186 514,207
    L 504,254
    Q 510,265 514,278
    Q 508,289 504,301
    L 485,336
    L 456,383
    L 427,383
    L 388,395
    Q 360,390 330,383
    L 301,383
    Q 285,360 272,336
    L 272,301
    L 127,301
    Q 110,270 98,242
    Q 76,222 59,207
    Q 52,190 50,172 Z
  " fill="#141812" stroke="#1D9E75" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Hainan island -->
  <ellipse cx="392" cy="416" rx="22" ry="13" fill="#141812" stroke="#1D9E75" stroke-width="1.6"/>

  <!-- Taiwan island -->
  <ellipse cx="543" cy="330" rx="11" ry="21" fill="#141812" stroke="#1D9E75" stroke-width="1.6"/>

  <!-- ===== LANGUAGE LABELS ===== -->

  <!-- Mandarin — North/Central (dominant, large area) -->
  <text x="312" y="160" fill="#7ab2d8" font-size="13.5" font-weight="700" font-family="system-ui,sans-serif">Mandarin</text>
  <text x="312" y="175" fill="#7ab2d8" font-size="10" font-family="system-ui,sans-serif">普通话 · most of China</text>

  <!-- Mandarin NE hint -->
  <text x="550" y="105" fill="#7ab2d8" font-size="9.5" font-family="system-ui,sans-serif" opacity="0.75">NE Mandarin</text>

  <!-- Mandarin SW (Sichuan) -->
  <text x="180" y="272" fill="#7ab2d8" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">Sichuan</text>
  <text x="180" y="284" fill="#7ab2d8" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">Mandarin</text>

  <!-- Wu — Shanghai / Zhejiang -->
  <circle cx="510" cy="250" r="3.5" fill="#e8954a"/>
  <line x1="513" y1="248" x2="540" y2="236" stroke="#e8954a" stroke-width="0.9" opacity="0.7"/>
  <text x="543" y="233" fill="#e8954a" font-size="11" font-weight="600" font-family="system-ui,sans-serif">Wu</text>
  <text x="543" y="246" fill="#e8954a" font-size="9" font-family="system-ui,sans-serif">吴语</text>

  <!-- Min — Fujian + Taiwan -->
  <circle cx="481" cy="312" r="3.5" fill="#a87ec0"/>
  <line x1="484" y1="310" x2="540" y2="298" stroke="#a87ec0" stroke-width="0.9" opacity="0.7"/>
  <text x="543" y="295" fill="#a87ec0" font-size="11" font-weight="600" font-family="system-ui,sans-serif">Min</text>
  <text x="543" y="308" fill="#a87ec0" font-size="9" font-family="system-ui,sans-serif">闽语</text>

  <!-- Cantonese — Guangdong -->
  <circle cx="432" cy="362" r="3.5" fill="#1D9E75"/>
  <text x="360" y="358" fill="#1D9E75" font-size="11" font-weight="600" font-family="system-ui,sans-serif">Cantonese</text>
  <text x="360" y="371" fill="#1D9E75" font-size="9" font-family="system-ui,sans-serif">粤语</text>

  <!-- Taiwan label -->
  <text x="560" y="333" fill="#888" font-size="9" font-family="system-ui,sans-serif">Taiwan</text>
  <text x="560" y="344" fill="#a87ec0" font-size="9" font-family="system-ui,sans-serif">(Min)</text>

  <!-- Hainan label -->
  <text x="392" y="420" fill="#888" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">Hainan</text>

  <!-- ===== LEGEND ===== -->
  <rect x="14" y="270" width="150" height="142" rx="5" fill="#0f0e0c" fill-opacity="0.88" stroke="#2a2926" stroke-width="0.5"/>
  <text x="24" y="289" fill="#bbb" font-size="10.5" font-weight="600" font-family="system-ui,sans-serif">Chinese language families</text>

  <circle cx="29" cy="305" r="4" fill="#7ab2d8"/>
  <text x="39" y="309" fill="#ccc" font-size="10.5" font-family="system-ui,sans-serif">Mandarin</text>

  <circle cx="29" cy="323" r="4" fill="#1D9E75"/>
  <text x="39" y="327" fill="#ccc" font-size="10.5" font-family="system-ui,sans-serif">Cantonese / Yue</text>

  <circle cx="29" cy="341" r="4" fill="#e8954a"/>
  <text x="39" y="345" fill="#ccc" font-size="10.5" font-family="system-ui,sans-serif">Wu</text>

  <circle cx="29" cy="359" r="4" fill="#a87ec0"/>
  <text x="39" y="363" fill="#ccc" font-size="10.5" font-family="system-ui,sans-serif">Min</text>

  <circle cx="29" cy="377" r="4" fill="#d4b84a"/>
  <text x="39" y="381" fill="#ccc" font-size="10.5" font-family="system-ui,sans-serif">Hakka (scattered)</text>

  <text x="24" y="402" fill="#555" font-size="9" font-family="system-ui,sans-serif">Approximate distribution only</text>
</svg>
