<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480">
  <rect width="700" height="480" fill="#1a1916"/>

  <!-- ===== CHINA LANDMASS (simplified outline) ===== -->
  <!-- Northwest / Xinjiang -->
  <polygon points="80,50 200,40 240,80 260,110 230,150 190,170 140,160 90,140 70,100" fill="#8a7a6a" stroke="#1a1916" stroke-width="1.5"/>
  <!-- Tibetan Plateau -->
  <polygon points="140,160 190,170 230,150 260,110 290,120 310,150 300,200 260,230 210,240 170,220 140,200" fill="#b0a898" stroke="#1a1916" stroke-width="1.5"/>
  <!-- Inner Mongolia / Gansu / Ningxia / Shaanxi — Mandarin North -->
  <polygon points="200,40 320,30 380,50 390,90 370,120 340,130 310,150 290,120 260,110 240,80" fill="#5b7fa6" stroke="#1a1916" stroke-width="1.5"/>
  <!-- Northeast Mandarin (Heilongjiang, Jilin, Liaoning) -->
  <polygon points="320,30 420,25 450,60 440,100 400,110 380,90 380,50" fill="#4a7098" stroke="#1a1916" stroke-width="1.5"/>
  <!-- North China Plain / Hebei / Shandong / Henan — Mandarin -->
  <polygon points="380,50 450,60 460,100 440,130 410,150 380,160 360,140 370,120 390,90" fill="#5b7fa6" stroke="#1a1916" stroke-width="1.5"/>
  <!-- Sichuan / Chongqing / Yunnan / Guizhou — SW Mandarin -->
  <polygon points="260,230 300,200 310,150 340,130 370,120 360,140 350,180 330,210 320,250 290,270 260,260" fill="#4d6e92" stroke="#1a1916" stroke-width="1.5"/>
  <!-- Hunan / Hubei / Jiangxi partial — Gan/Xiang + transition -->
  <polygon points="360,140 410,150 430,180 420,210 390,230 360,240 340,220 330,210 350,180" fill="#5b7fa6" stroke="#1a1916" stroke-width="1.5"/>
  <!-- Jiangxi / partial -->
  <polygon points="390,230 420,210 450,220 450,250 430,270 400,270 380,250" fill="#5b7fa6" stroke="#1a1916" stroke-width="1.5"/>
  <!-- Wu (Shanghai, Zhejiang, S. Jiangsu) -->
  <polygon points="440,130 460,100 490,110 500,140 490,170 470,185 450,175 430,160 440,150" fill="#d4842a" stroke="#1a1916" stroke-width="1.5"/>
  <!-- Fujian (Min) -->
  <polygon points="450,175 470,185 490,170 510,180 520,210 500,240 470,250 450,240 445,215 450,195" fill="#8a52a0" stroke="#1a1916" stroke-width="1.5"/>
  <!-- Guangdong partial Hakka -->
  <polygon points="380,250 400,270 430,270 450,260 450,240 430,280 400,300 370,290 360,270" fill="#c9a820" stroke="#1a1916" stroke-width="1.5"/>
  <!-- Guangdong main / Cantonese -->
  <polygon points="430,280 450,260 470,250 500,240 520,250 530,270 510,300 480,310 450,310 420,300" fill="#1D9E75" stroke="#1a1916" stroke-width="1.5"/>
  <!-- Guangxi (Zhuang + Cantonese south) -->
  <polygon points="320,250 360,240 360,270 370,290 400,300 420,300 420,330 380,340 340,330 310,300 290,280 290,270" fill="#2a8f65" stroke="#1a1916" stroke-width="1.5"/>
  <!-- Hainan (Min) -->
  <ellipse cx="430" cy="365" rx="30" ry="20" fill="#8a52a0" stroke="#1a1916" stroke-width="1.5"/>
  <!-- Taiwan (Min) -->
  <ellipse cx="560" cy="270" rx="18" ry="30" fill="#8a52a0" stroke="#1a1916" stroke-width="1.5"/>

  <!-- ===== LEGENDS ===== -->
  <rect x="14" y="270" width="160" height="198" rx="6" fill="#0f0e0c" fill-opacity="0.82" stroke="#333" stroke-width="0.5"/>

  <rect x="24" y="282" width="12" height="12" rx="2" fill="#5b7fa6"/>
  <text x="42" y="293" fill="#ccc" font-size="11" font-family="system-ui,sans-serif">Mandarin</text>

  <rect x="24" y="300" width="12" height="12" rx="2" fill="#1D9E75"/>
  <text x="42" y="311" fill="#ccc" font-size="11" font-family="system-ui,sans-serif">Cantonese / Yue</text>

  <rect x="24" y="318" width="12" height="12" rx="2" fill="#d4842a"/>
  <text x="42" y="329" fill="#ccc" font-size="11" font-family="system-ui,sans-serif">Wu</text>

  <rect x="24" y="336" width="12" height="12" rx="2" fill="#8a52a0"/>
  <text x="42" y="347" fill="#ccc" font-size="11" font-family="system-ui,sans-serif">Min</text>

  <rect x="24" y="354" width="12" height="12" rx="2" fill="#c9a820"/>
  <text x="42" y="365" fill="#ccc" font-size="11" font-family="system-ui,sans-serif">Hakka</text>

  <rect x="24" y="372" width="12" height="12" rx="2" fill="#b0a898"/>
  <text x="42" y="383" fill="#ccc" font-size="11" font-family="system-ui,sans-serif">Tibetan</text>

  <rect x="24" y="390" width="12" height="12" rx="2" fill="#8a7a6a"/>
  <text x="42" y="401" fill="#ccc" font-size="11" font-family="system-ui,sans-serif">Uyghur / Xinjiang</text>

  <rect x="24" y="408" width="12" height="12" rx="2" fill="#2a8f65"/>
  <text x="42" y="419" fill="#ccc" font-size="11" font-family="system-ui,sans-serif">Cantonese / Zhuang mix</text>

  <text x="24" y="452" fill="#888" font-size="9" font-family="system-ui,sans-serif">Simplified. Hakka is scattered across</text>
  <text x="24" y="463" fill="#888" font-size="9" font-family="system-ui,sans-serif">Guangdong, Fujian &amp; Jiangxi.</text>

  <!-- ===== REGION LABELS ===== -->
  <!-- Xinjiang -->
  <text x="120" y="100" fill="#fff" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle" opacity="0.85">Xinjiang</text>
  <!-- Tibet -->
  <text x="210" y="200" fill="#fff" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle" opacity="0.85">Tibet</text>
  <!-- NE -->
  <text x="390" y="65" fill="#fff" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle" opacity="0.85">Northeast</text>
  <!-- North -->
  <text x="415" y="120" fill="#fff" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle" opacity="0.85">N. China</text>
  <!-- Sichuan -->
  <text x="300" y="240" fill="#fff" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle" opacity="0.85">Sichuan</text>
  <!-- Shanghai / Wu -->
  <text x="472" y="150" fill="#fff" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle" opacity="0.85">Shanghai</text>
  <text x="472" y="162" fill="#fff" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle" opacity="0.7">(Wu)</text>
  <!-- Fujian -->
  <text x="487" y="210" fill="#fff" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle" opacity="0.85">Fujian</text>
  <!-- Guangdong -->
  <text x="475" y="290" fill="#fff" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle" opacity="0.85">Guangdong</text>
  <!-- Guangxi -->
  <text x="355" y="305" fill="#fff" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle" opacity="0.85">Guangxi</text>
  <!-- Hainan -->
  <text x="430" y="368" fill="#fff" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle" opacity="0.85">Hainan</text>
  <!-- Taiwan -->
  <text x="582" y="265" fill="#fff" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle" opacity="0.9">Taiwan</text>
  <line x1="562" y1="265" x2="578" y2="265" stroke="#888" stroke-width="0.8"/>

  <!-- Title -->
  <text x="530" y="430" fill="#666" font-size="10" font-family="system-ui,sans-serif" text-anchor="middle">Approximate distribution only</text>
</svg>
