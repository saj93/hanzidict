<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 185" width="600" height="185" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="600" height="185" rx="12" fill="#1a1916"/>

  <rect x="15" y="12" width="56" height="18" rx="9" fill="#232220" stroke="#2e2d29" stroke-width="1"/>
  <text x="43" y="25" fill="#9a9791" font-size="10" font-weight="600" text-anchor="middle">Mac</text>

  <!-- Step 1 -->
  <rect x="12" y="33" width="132" height="144" rx="8" fill="#232220" stroke="#2e2d29" stroke-width="1"/>
  <circle cx="78" cy="65" r="18" fill="#1D9E75"/>
  <text x="78" y="71" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">1</text>
  <!-- Monitor icon -->
  <rect x="63" y="83" width="30" height="20" rx="2" fill="none" stroke="#9a9791" stroke-width="1.5"/>
  <line x1="75" y1="103" x2="81" y2="108" stroke="#9a9791" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72" y1="108" x2="84" y2="108" stroke="#9a9791" stroke-width="1.5" stroke-linecap="round"/>
  <text x="78" y="122" fill="#f0ede6" font-size="12" font-weight="600" text-anchor="middle">System Settings</text>
  <text x="78" y="137" fill="#9a9791" font-size="10" text-anchor="middle">Keyboard →</text>
  <text x="78" y="151" fill="#9a9791" font-size="10" text-anchor="middle">Input Sources</text>

  <path d="M150 107 L156 107 M153 104 L156 107 L153 110" stroke="#3a3830" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Step 2 -->
  <rect x="160" y="33" width="132" height="144" rx="8" fill="#232220" stroke="#2e2d29" stroke-width="1"/>
  <circle cx="226" cy="65" r="18" fill="#1D9E75"/>
  <text x="226" y="71" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">2</text>
  <rect x="217" y="83" width="18" height="18" rx="3" fill="none" stroke="#9a9791" stroke-width="1.5"/>
  <text x="226" y="96" fill="#1D9E75" font-size="14" font-weight="700" text-anchor="middle">+</text>
  <text x="226" y="122" fill="#f0ede6" font-size="12" font-weight="600" text-anchor="middle">Add Source</text>
  <text x="226" y="137" fill="#9a9791" font-size="10" text-anchor="middle">Click + to add</text>
  <text x="226" y="151" fill="#9a9791" font-size="10" text-anchor="middle">a new input</text>

  <path d="M298 107 L304 107 M301 104 L304 107 L301 110" stroke="#3a3830" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Step 3 -->
  <rect x="308" y="33" width="132" height="144" rx="8" fill="#232220" stroke="#2e2d29" stroke-width="1"/>
  <circle cx="374" cy="65" r="18" fill="#1D9E75"/>
  <text x="374" y="71" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">3</text>
  <text x="374" y="105" fill="#9a9791" font-size="22" text-anchor="middle">中</text>
  <text x="374" y="122" fill="#f0ede6" font-size="12" font-weight="600" text-anchor="middle">Select Chinese</text>
  <text x="374" y="137" fill="#9a9791" font-size="10" text-anchor="middle">Simplified →</text>
  <text x="374" y="151" fill="#9a9791" font-size="10" text-anchor="middle">Pinyin – Simplified</text>

  <path d="M446 107 L452 107 M449 104 L452 107 L449 110" stroke="#3a3830" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Step 4 -->
  <rect x="456" y="33" width="132" height="144" rx="8" fill="#232220" stroke="#2e2d29" stroke-width="1"/>
  <circle cx="522" cy="65" r="18" fill="#1D9E75"/>
  <text x="522" y="71" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">4</text>
  <!-- Keyboard shortcut visual -->
  <rect x="508" y="83" width="18" height="16" rx="3" fill="#2a2926" stroke="#3a3830" stroke-width="1"/>
  <text x="517" y="95" fill="#9a9791" font-size="9" font-weight="700" text-anchor="middle">⌘</text>
  <text x="527" y="93" fill="#5e5c57" font-size="12" text-anchor="middle">+</text>
  <rect x="531" y="83" width="18" height="16" rx="3" fill="#2a2926" stroke="#3a3830" stroke-width="1"/>
  <text x="540" y="95" fill="#9a9791" font-size="9" font-weight="700" text-anchor="middle">␣</text>
  <text x="522" y="122" fill="#f0ede6" font-size="12" font-weight="600" text-anchor="middle">Switch Input</text>
  <text x="522" y="137" fill="#9a9791" font-size="10" text-anchor="middle">⌘ Space</text>
  <text x="522" y="151" fill="#9a9791" font-size="10" text-anchor="middle">or menu bar icon</text>
</svg>
